[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort imports
]
ignore = [
    "E501",  # line length handled flexibly
    "B008",  # FastAPI Depends in function signature
    "E402",  # Module level import not at top (needed for sys.path configuration in test/eval scripts)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
