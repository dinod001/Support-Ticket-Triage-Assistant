name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Lint & Unit/Integration Tests (Mocked LLM)
  # ============================================================================
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check app/ tests/ evaluation/

      - name: Run Pytest Suite (Mocked LLM Provider)
        env:
          LLM_PROVIDER: "mock"
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --durations=10

      - name: Run Automated Evaluation Benchmark (Stretch Goal #2)
        env:
          LLM_PROVIDER: "mock"
        run: |
          python -m evaluation.benchmark --provider mock

  # ============================================================================
  # 2. Frontend Build Verification (TypeScript & Vite)
  # ============================================================================
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Build frontend production bundle
        run: |
          npm run build

  # ============================================================================
  # 3. Docker Image Build Verification
  # ============================================================================
  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: support-ticket-triage-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: support-ticket-triage-frontend:test
