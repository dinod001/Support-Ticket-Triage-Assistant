name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name prefix (lowercase)
        id: image-meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${OWNER_LOWER}/support-ticket-triage-backend" >> $GITHUB_OUTPUT
          echo "frontend_image=ghcr.io/${OWNER_LOWER}/support-ticket-triage-frontend" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.image-meta.outputs.backend_image }}:latest

      - name: Build & Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.image-meta.outputs.frontend_image }}:latest
